name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-ubuntu:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Packaging check, not a behaviour check: the suite already runs everything
  # under CATARACT_PURE=1, but that leaves the compiled extension on disk. This
  # installs the built gem with no extension at all, which is the only way to
  # catch a stub Makefile that stops satisfying RubyGems, or a file the pure
  # backend needs going missing from spec.files.
  pure-only-install:
    name: Install with --disable-native-extension
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Install without the C extension and verify the pure backend
      run: bundle exec rake gem:verify_pure_only

  lint:
    if: github.actor == 'jamescook'
    needs: test-ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Cache clang-tidy results
        id: lint-cache
        uses: actions/cache@v4
        with:
          path: .lint-passed
          key: lint-${{ hashFiles('ext/**/*.c', 'ext/**/*.h', '.clang-tidy', 'Gemfile', '.github/workflows/*.yml', 'cataract.gemspec', 'Rakefile') }}

      - name: Install clang-tidy
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy

      - name: Run clang-tidy
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: |
          clang-tidy --version
          bundle exec rake lint
          touch .lint-passed
